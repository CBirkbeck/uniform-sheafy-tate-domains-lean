# substantive relationship (`formalizes`), so the derived origin is `source-based`.
sources:
  - title: "Uniform sheafy Tate rings that are not stably uniform"
    authors: ["Christopher Birkbeck", "Alex Torzewski"]
    id: "https://cbirkbeck.github.io/uniform-sheafy-tate-domains/"
    type: "paper"
    relationship: "formalizes"
    license: "none stated"
    author_endorsement: "participated"
    note: >-
      The paper this repository formalises. Its two headline theorems are the results
      certified here: the finite-jet pinching algebra (Theorem 1.1) and the weighted-parity
      algebra (Theorem 8.1, formalised at the weight `w(n) = n`). The Lean docstrings were written against an earlier revision
      and cite these as [FJP] Thm 1.3 and [WP] thm 6.2; `Adic spaces/Comparator/README.md`
      carries the numbering crosswalk. A source author is an author of this formalisation,
      hence `participated`. No arXiv identifier or DOI as of 2026-08-19; the project page
      above is the most stable identifier that exists. Novelty of the mathematics is the
      paper's claim, not a claim established by this formalisation.

  - title: "Adic Spaces (lecture notes)"
    authors: ["Torsten Wedhorn"]
    id: "arXiv:1910.05934"
    type: "paper"
    relationship: "background"
    license: "arXiv nonexclusive-distrib/1.0"
    author_endorsement: "not-contacted"
    note: >-
      The source of the ambient theory: Huber and Tate rings (§6), bounded and power-bounded
      subsets (§5), uniform and stably uniform pairs (Definitions 7.36, 7.37), rational
      localisations and the structure presheaf (§7–8), and sheafiness (Definition 8.26,
      Theorem 8.28(b)). Supplies the definitions the certified statements are phrased in, not
      the result itself.

  - title: "The Nonarchimedean Scottish Book"
    authors: []
    contributors:
      - name: "Kiran S. Kedlaya"
        role: "editor of the problem collection"
    id: "https://scripts.mit.edu/~kedlaya/wiki/index.php?title=The_Nonarchimedean_Scottish_Book"
    type: "web discussion"
    relationship: "background"
    license: "none stated"
    author_endorsement: "not-contacted"
    note: >-
      The problem collection that poses Question 7 ("Let (A, A⁺) be a sheafy uniform Huber
      pair. Is (A, A⁺) necessarily stably uniform?"), which the formalised theorems answer in
      the negative. Recorded as background: it poses the question rather than supplying the
      result. A community wiki with no explicit copyright or licence notice; the URL above is
      the most stable identifier that exists.

