fidelity:
  divergences: >-
    (1) SCOPE OF THE FJP BASE. The paper states its main theorem over a complete discretely
    valued nonarchimedean field k. The certified statements (`FiniteJetMain.lean`)
    instantiate k at the restricted Laurent-series field over an arbitrary coefficient
    field F — the base of the revision the Lean docstrings cite; the `FiniteJetOver` layer
    additionally states the uniform / domain / nonnoetherian / not-stably-uniform endpoints
    over an abstract such k (any complete ultrametric nontrivially-normed field, with the
    uniformizer explicit or chosen from a DVR hypothesis).
    (2) THE WP BASE. Theorem 8.1 is certified over an abstract complete ultrametric
    nontrivially-normed field K with `IsDiscreteValuationRing 𝒪[K]` — the paper's "complete
    discretely valued nonarchimedean field", with "discretely valued" rendered as the DVR
    property of the valuation ring.
    (3) STRONGLY SHEAFY. The paper's "(strongly) sheafy" (every 𝒜⟨V₁,…,Vₛ⟩ is sheafy) is
    rendered by the shifted-weight algebras (`shiftWeight`): the certificate pins
    sheafiness of `WPA K (shiftWeight id s)` for every s, and sheafiness itself is
    "every valid ring of integral elements gives a sheaf" (`IsSheafyComplete`, the
    complete-ring form of Wedhorn Definition 8.26).
    (4) SHEAFINESS AT TATE SCOPE. Wedhorn's Definition 8.26 is stated for arbitrary f-adic
    rings; the formalisation defines it at Tate (analytic) scope only (`IsSheafyTateRing`),
    because the restriction maps of Proposition 8.2 are derived from the complete-analytic
    route. Kedlaya Remark 1.6.10 records that the analytic and non-analytic cases genuinely
    differ. Both certified examples are Tate, so the statements are unaffected.
  statement_provenance: >-
    The Palomar Challenge (`Palomar/Challenge.lean`) is self-contained on Mathlib: it defines,
    following Wedhorn, every notion its statements use — Huber/Tate rings, the adic spectrum,
    rational localisations and their completions, the structure presheaf as a
    `TopCat.Presheaf TopCommRingCat`, sheafiness as Mathlib's `TopCat.Presheaf.IsSheaf`, the
    Tate algebras as Gauss-norm completions of polynomial rings, and `𝓐` as the closure of the
    jet polynomials of [FJP] (1.7) — and imports no project source. `Palomar/Bridge.lean`
    proves these notions agree with the library's (the completed localisations are the same
    type; restriction families are unique; the Challenge's sheafiness is equivalent to the
    library's finite rational-cover criterion, `PalomarBridge.isSheafy_iff`), and
    `Palomar/Bridge/Jet.lean`, `Palomar/Bridge/TateExt.lean` that its rings are isometrically
    isomorphic to the library's. Two presentational choices were made for the Challenge and
    are equivalent to the library's statements, not weaker: sheafiness is stated for every
    ring of integral elements (`IsSheafyComplete`, Wedhorn 8.26, which the library also
    proves) rather than for `𝓐⁺ = 𝓐°` alone; and the Tate algebras `𝓐⟨X₁,…,Xₙ⟩` carry the
    Gauss-norm topology, which the library identifies with its Tate-ring topology. The
    in-library comparator challenges (`Adic spaces/Comparator/`) restate the conclusions from
    the library's definition layer instead.
  checked_by: ""                   # human sign-off pending

acknowledgements: ""
