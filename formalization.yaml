# [Palomar, required] The review completed BEFORE submission. This is metadata about
# work already done; it is not, and does not anticipate, the Palomar review.
review:
  status: "agent-reviewed"
  reviewers:
    - name: "mathlib-quality automated review lanes"
      role: >-
        Independent AI review passes over the Lean development (definition necessity,
        generalisation, automation, mathlib naming and style), run as a distinct step from
        the proving work. https://github.com/CBirkbeck/mathlib-quality
    - name: "OpenAI Codex"
      role: >-
        Audit passes over the paper's claims against the Lean proofs, and over the
        attribution of results, carried out in the companion paper repository
        https://github.com/CBirkbeck/uniform-sheafy-tate-domains
  notes: >-
    No human peer review, and no external reviewer. The review recorded here is automated:
    distinct AI passes examined the development after it was written, separately from the
    agent that produced it.

    Independently of review, the certified statements are checked mechanically:
    leanprover/comparator pins each statement in a challenge module that cannot see its own
    proof, replays the proof through the Lean kernel, and confirms the axiom set is within
    {propext, Quot.sound, Classical.choice}. That is a mechanical check, not a review, and it
    is not the basis for the status above.

status:
  scope: >-
    Huber/Tate rings, adic spectra, rational localizations and the structure presheaf
    (Wedhorn); the finite-jet ring (Theorem 1.1) and its chart; the weighted-parity algebra
    (Theorem 8.1) — both uniform, strongly sheafy, non-noetherian domains with `A° = A₀`
    that are not stably uniform, the first with a non-reduced bad chart and the second with
    a bad chart that is an integral domain; and formal statements of the Nonarchimedean
    Scottish Book problem list. Both theorems are certified over an abstract complete
    ultrametric nonarchimedean field whose valuation ring is a DVR, not over a fixed witness
    field. A parallel finite-jet development over the concrete base `LaurentSeries F` is also
    present (`FiniteJet`, as against the certified `FiniteJetOver`).
  sorry_count: 0                   # scope: the formalization reported here — the fourteen
                                   # certified endpoints (seven per theorem) and their full
                                   # proof closures. Their axiom
                                   # sets are exactly [propext, Classical.choice, Quot.sound]
                                   # (no sorryAx), checked per-result by comparator. The
                                   # wider repository tree carries WIP `sorry`s outside this
                                   # report's scope (Scottish Book problem STATEMENTS, the
                                   # quarantined WP/HeadReduced.lean route, and general
                                   # Wedhorn 8.28(b) campaign frontiers). As of this commit:
                                   # 155 declarations with `sorry` across the tree, none of
                                   # them in the FJP group (0) or on a certified closure.
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

