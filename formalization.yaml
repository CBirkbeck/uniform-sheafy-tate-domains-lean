# formalization.yaml — self-report for this repository, in the mathlib-initiative
# schema v0.4 (https://github.com/mathlib-initiative/formalization.yaml), with the
# additional fields the Palomar registry makes mandatory
# (https://github.com/PalomarRegistry/PalomarPolicy/blob/main/CONTRIBUTING.md §3).
#
# `sources[].license` is the licence of the SOURCE MATERIAL being formalized — the paper
# or notes whose statements were transcribed — not the licence of this Lean code, which is
# `project.license`.
#
# FIELDS LEFT BLANK ARE NOT YET KNOWN. They are deliberately empty rather than guessed.

version: "v0.4"

project:
  name: "Uniform sheafy Tate rings that are not stably uniform"

  description: >-
    A Lean 4 formalisation of *Uniform sheafy Tate rings that are not stably uniform*
    (Birkbeck–Torzewski), answering Question 7 of Kedlaya's *Nonarchimedean Scottish Book* in
    the negative: a sheafy uniform Huber pair need not be stably uniform. Buzzard–Verberkmoes
    and Mihara proved that stably uniform Tate Huber rings are sheafy; whether the converse
    holds was open.

    The paper gives two complete Tate algebras over a complete discretely valued field `k`
    that are uniform, nonnoetherian integral domains with `A° = A₀`, strongly sheafy (every
    Tate algebra `A⟨X₁, …, Xₙ⟩` is sheafy), and yet not stably uniform, because an explicit
    rational localisation is not uniform. The first (Theorem 1.1) is the finite-jet pinching
    algebra `𝓐 = B ×_D C`, the pullback of a Milnor square with `B = k⟨W, Q⟩/(Q²)`,
    `C = k⟨W, W⁻¹⟩⟨Q⟩`, `D = C/(Q²)` — concretely, the series in `k⟨W, W⁻¹⟩⟨Q⟩` whose `Q⁰`-
    and `Q¹`-coefficients have nonnegative `W`-support; its bad chart `𝓐⟨W/ϖ⟩ ≅ k⟨X, Q⟩/(Q²)`
    is non-reduced. The second (Theorem 8.1) is the weighted-parity algebra `𝒜_w`, whose bad
    chart is an integral domain; the paper proves it for every unbounded weight `w ≥ 1`, the
    formalisation for `w(n) = n`.

    This submission certifies the seven conclusions of Theorem 1.1, stated self-containedly on
    Mathlib in `Palomar/Challenge.lean` over an arbitrary complete ultrametric field with DVR
    valuation ring; Theorem 8.1 is certified by the repository's in-library configuration.
    The repository also develops the surrounding theory after Wedhorn's *Adic Spaces*: Huber
    and Tate rings, the adic spectrum, rational localisations, the structure presheaf, and
    sheafiness (Definition 8.26), including the strongly noetherian theorem (8.28(b)).

  authors:
    - "Christopher Birkbeck"
    - "Alex Torzewski"

  # [Palomar, required] People responsible for THIS submitted formalisation.
  responsible_maintainers:
    - "Christopher Birkbeck"
    - "Alex Torzewski"

  license: "Apache-2.0"   # matches the root LICENSE file and the Lean file headers.

# [Palomar, required] Classification of the MATHEMATICS, not of the use of Lean or AI.
