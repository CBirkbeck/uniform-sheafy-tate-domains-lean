        The source paper records that the Lean formalisation was carried out by Claude Code.
        This entry covers the production of the LEAN CODE.

    - method: "other"
      models: ["ChatGPT 5.6 Sol"]
      framework: ""
      tool_setup: ""
      cost:
        wall_time: ""
        spend_usd: "1 month of a ChatGPT Pro subscription (flat-rate, not metered)"
        hardware: ""
      prompting_notes: >-
        Discovery of the underlying MATHEMATICS, not of the Lean code. Per the source paper's
