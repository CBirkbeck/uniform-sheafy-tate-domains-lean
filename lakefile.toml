# Lean formalisation accompanying
#   *Uniform sheafy Tate domains that are not stably uniform* (Birkbeck–Torzewski)
#   https://cbirkbeck.github.io/uniform-sheafy-tate-domains/
#
# One library, one external dependency (mathlib). The toolchain and the mathlib revision are
# pinned to the Lean v4.33.0 release line — see README.md for why that line specifically.
name = "UniformSheafyTateDomains"
defaultTargets = ["«Adic spaces»"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c"     # mathlib release tag v4.33.0, 2026-08-10 — matches lean-toolchain

# The library deliberately declares no `globs`: only the root module `Adic spaces.lean` is a
# build target. That is what keeps `Adic spaces/Comparator/Challenge.lean` (whose proofs are
# all `sorry`, by design) out of the default build — it is built by name, by scripts/certify.sh.
[[lean_lib]]
name = "«Adic spaces»"
srcDir = "."
[lean_lib.leanOptions]
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

# The Palomar submission library. Palomar requires every dotted component of the Challenge
# and Solution module names to match `[A-Za-z_][A-Za-z0-9_']*`
# (PalomarPolicy/CONTRIBUTING.md §2.2), which `«Adic spaces».Comparator.Challenge` fails on
# the space. These modules carry the same certificates under space-free names.
#
# `Palomar/Challenge.lean` is additionally self-contained on Mathlib: Palomar forbids any
# project source in the Challenge's transitive import closure (§2.4). It is not part of the
# default build — it carries `sorry` by design, exactly as the Comparator challenge does.
[[lean_lib]]
name = "Palomar"
srcDir = "."
roots = ["Palomar.Challenge", "Palomar.Defs", "Palomar.Bridge", "Palomar.Bridge.Jet", "Palomar.Bridge.TateExt", "Palomar.Solution"]
[lean_lib.leanOptions]
relaxedAutoImplicit = false
